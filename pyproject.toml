[tool.poetry]
name = "lc_nl2sql"
version = "0.1.0"
description = "Long Context NL2SQL"
authors = ["Yeounoh Chung <yeounoh@google.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
google-cloud-aiplatform = ">= 1.38"
google-generativeai = ">=0.5.3"
google-ai-generativelanguage = ">=0.6.3"
python = ">=3.10,<3.13"
transformers = "4.45.1"
sentence-transformers = "2.7.0"
faiss-cpu = "1.8.0"
peft = "0.10.0"
accelerate = "1.0.0"
einops = "0.6.1"
evaluate = "0.4.0"
scikit-learn = ">=1.5.1"
numpy = ">=2.0.0"
sentencepiece = "^0.2.0"
wandb = "0.18.0"
func-timeout = "4.3.5"
datasets = ">=2.14.6"
trl = ">=0.8.6"
pydantic = "1.10.11"
deepspeed = "0.10.2"
gradio = ">=3.36.0"
uvicorn-http2 = "^0.0.0"
uvicorn = "^0.24.0.post1"
fastapi = "0.95.1"
transformers-stream-generator = "^0.0.4"
matplotlib = "^3.8.1"
sse-starlette = "^1.6.5"
jieba = "^0.42.1"
rouge-chinese = "^1.0.3"
rapidfuzz = "^3.5.2"
scipy = "^1.11.3"
sqlparse = "^0.4.4"
sqlglot = "^25.9.0"
nltk = "^3.8.1"
jsonlines = "^4.0.0"
pymysql = "1.1.0"
pyyaml = "6.0.1"
black = "^23.11.0"
pyright = "^1.1.335"
pylint = "^3.0.2"
torch = "^2.3.1"
markupsafe = "2.1.3"
prettytable = "^3.9.0"
docopt = "^0.6.2"
pandas = "^2.0"
bitsandbytes = "0.41.3.post2"
openai = "^1.6.1"
kvpress = "^0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"